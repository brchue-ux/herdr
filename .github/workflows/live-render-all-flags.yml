name: Live render (all flags on)

# Tier A live check: a real headless herdr server driven over its socket API by a
# real client attached through an explicitly sized PTY, with every runtime flag
# this fork ships turned on. No X server and no terminal emulator involved — the
# evidence is the bytes the client actually receives.
#
# This exists because the bugs that shipped in this area were all invisible to
# the unit suite: they were found by decoding real emitted bytes.

on:
  workflow_dispatch:
  # On pull requests rather than on pushes to one branch prefix. A check that
  # only fires for `claude/**` cannot see anyone else's change, and cannot be
  # made a required status check either — GitHub can only require a check that
  # runs on the pull request itself.
  # Deliberately NOT path-filtered at the trigger. `live-render` is a required
  # status check, and a workflow that never triggers creates no check-run at
  # all — the requirement then sits "Expected" forever and blocks an otherwise
  # green pull request (this happened on #130 and #132, both force-merged).
  # A job GitHub marks "skipped" *does* satisfy a required check, so the path
  # filtering moved down to the job's `if:` below. Same cost saving, but the
  # check-run always exists.
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  # dorny/paths-filter reads the pull request's changed files over the API.
  pull-requests: read

env:
  RUST_TOOLCHAIN_VERSION: 1.96.1

concurrency:
  group: live-render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The one place the path list lives. The expensive job below gates on this
  # job's output rather than on a trigger-level `paths:` filter.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      live_render: ${{ steps.filter.outputs.live_render }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.3
        with:
          # The build dominates the cost, so it should not run for changes that
          # cannot affect what reaches the wire.
          filters: |
            live_render:
              - 'src/ui/sidebar/**'
              - 'src/kitty_graphics.rs'
              - 'src/anim/**'
              - 'src/anim.rs'
              - 'src/config/sidebar.rs'
              - 'data/herdr-all-flags-live/**'
              - '.github/workflows/live-render-all-flags.yml'

  live-render:
    needs: changes
    # workflow_dispatch always runs it; a pull request only when the diff
    # touches a path above. Skipped still reports a conclusion, which is the
    # point — see the trigger comment.
    if: github.event_name != 'pull_request' || needs.changes.outputs.live_render == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          # musl too: that is the target the released linux asset is built for,
          # so it is the binary a person actually swaps to. Testing only the gnu
          # build leaves the shipped artifact unexercised.
          targets: x86_64-unknown-linux-musl

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      - name: Install build tools and fonts
        run: |
          sudo find /etc/apt/sources.list.d -type f \( -iname '*microsoft*' -o -iname '*azure-cli*' \) -print -delete
          sudo apt-get update
          # fonts-dejavu matters: image_card::is_available requires a proportional
          # face found on the machine at runtime, and herdr ships no font. Without
          # one the pixel-card path stays off and every card flag is inert.
          sudo apt-get install -y cmake ninja-build fonts-dejavu fonts-liberation musl-tools

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: live-render

      # Release, deliberately. A debug build was tried to save ~3 min of compile
      # and it was a false economy: debug card rasterisation and PNG encode are
      # slow enough that almost nothing renders inside the capture's settles —
      # run 2 produced 2,568 bytes against run 1's 5,696,056 from the same six
      # captures, and still passed, because the only assertion was "no panic".
      # The settles are wall-clock, so the binary's speed decides how much of
      # the render lands inside them. Hence release, plus the volume guard in
      # run.sh so an empty capture can never be green again.
      - name: Build
        run: cargo build --release --locked

      # Two passes over the same binary, differing only in which terminal the
      # SERVER believes it is under, because that is what picks the pixel format.
      # Rio must produce f=32 on translucent cards; kitty must correctly decline
      # RGB24 for them and stay on PNG. One pass can only ever confirm one branch.
      - name: Live capture — server believes Rio
        env:
          HERDR_BIN: ${{ github.workspace }}/target/release/herdr
          HERDR_NS: herdr
          SERVER_TERM: rio
        run: |
          chmod +x data/herdr-all-flags-live/run.sh
          ./data/herdr-all-flags-live/run.sh

      - name: Live capture — server believes kitty
        env:
          HERDR_BIN: ${{ github.workspace }}/target/release/herdr
          HERDR_NS: herdr
          SERVER_TERM: kitty
          CAPTURE_ROOT: /tmp/hallflags-kitty
        run: ./data/herdr-all-flags-live/run.sh

      # The released linux asset is musl, and nothing else on the push path
      # builds it, so a musl-only break would otherwise not surface until a
      # release. This proves the shipped target compiles; running the capture
      # against it is follow-up work, tracked with the swap check.
      - name: Build this branch for musl (the shipped target)
        run: |
          cargo build --release --locked --target x86_64-unknown-linux-musl
          file target/x86_64-unknown-linux-musl/release/herdr

      - name: Upload captures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: live-render-captures
          path: data/herdr-all-flags-live/proof/
          if-no-files-found: warn
