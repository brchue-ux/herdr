[package]
name = "herdr"
version = "0.8.0"
edition = "2021"
build = "build.rs"
description = "terminal workspace manager for AI coding agents"
license = "Apache-2.0"
repository = "https://github.com/herdrdev/herdr"
homepage = "https://herdr.dev"
keywords = ["terminal", "tui", "ai", "agents", "multiplexer"]
categories = ["command-line-utilities"]
include = [
    "src/**/*",
    "assets/sounds/*",
    "docs/next/api/herdr-api.schema.json",
    "skills/herdr/SKILL.md",
    "README.md",
    "LICENSE",
    "Cargo.toml",
]

[features]
default = ["gpu-raster"]
# GPU compute for the client-side card rasteriser's bloom splat/blend pass
# (`src/gpu/`). On by default so shipped binaries carry it; a Linux-only server
# build that never rasterises cards for a client can drop `wgpu` and its backend
# tree with `--no-default-features`. Turning it off does not change any pixel:
# `src/gpu/bloom_disabled.rs` reports the compute path unavailable and every
# caller keeps the CPU path it already had.
gpu-raster = ["dep:wgpu"]

[dependencies]
# Glyph rasterisation for the sidebar's pixel cards. Pure Rust, no system
# library, and no font of its own: the face comes off the machine at runtime
# (src/ui/sidebar/image_card/font.rs) so Herdr ships no font data.
ab_glyph = "0.2"
base64 = "0.22.1"
bincode = { version = "2", features = ["serde"] }
bytes = "1"
clap = { version = "4.5", default-features = false, features = ["std", "help", "usage"] }
clap_complete = "4.5"
crossterm = "0.29"
ctrlc = { version = "3", features = ["termination"] }
interprocess = "2.4.2"
jsonc-parser = { version = "0.33.1", default-features = false, features = ["cst", "serde_json"] }
libc = "0.2"
portable-pty = "=0.9.0"
png = "0.17"
ratatui = { version = "0.30", features = ["serde", "unstable-rendered-line-info"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1.14"
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
toml = "0.8"
# Already built as part of `toml`; used directly only for the key spans that
# turn config diagnostics into file:line locations.
toml_edit = { version = "0.22", default-features = false, features = ["parse"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-width = "0.2"
schemars = { version = "1.2.1", features = ["derive"] }
# GPU compute for the card bloom pass (`src/gpu/`). `default-features = false`
# keeps this to the compute half of wgpu: no surface, no windowing, no WebGPU —
# Herdr never presents a swapchain, it reads a storage buffer back and hands the
# pixels to the Kitty graphics protocol. Backends are added per target below:
# there is no portable set, and pulling every backend onto every platform is
# most of what wgpu costs to build.
wgpu = { version = "27", default-features = false, features = [
    "wgsl",
], optional = true }

# Vulkan on Linux covers Mesa's hardware drivers and, for a machine with no GPU
# at all, its `lavapipe` software adapter — which is how a Linux dev box or CI
# exercises this path at all. GL is the fallback for a driver stack too old for
# Vulkan compute. Deliberately not `cfg(unix)`: macOS is Unix and implements
# neither, and `wgpu::Instance::new` panics on a target with no backend
# compiled in.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
wgpu = { version = "27", default-features = false, features = [
    "vulkan",
    "gles",
], optional = true }

# Metal is the only compute backend macOS implements.
[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "27", default-features = false, features = [
    "metal",
], optional = true }

[patch.crates-io]
portable-pty = { path = "vendor/portable-pty" }

[target.'cfg(windows)'.dependencies]
# DX12 is the first-class compute backend on Windows and the one the captain's
# RX 6900 XT runs; Vulkan is kept as the second answer for a machine whose DX12
# driver refuses a device. See the `wgpu` entry under `[dependencies]`.
wgpu = { version = "27", default-features = false, features = [
    "dx12",
    "vulkan",
], optional = true }
wmi = { version = "0.18.4", default-features = false }
windows-sys = { version = "0.61.2", features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Kernel",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
